services:
  - type: web
    name: sstwas
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: STORE_MODE
        value: shared
      - key: STORE_TIMEZONE
        value: Africa/Harare
      - key: BOOTSTRAP_CHIZZYBOI_STORE
        value: true
      - key: ALLOW_SIMULATED_PAYMENTS
        value: false
      # Real payments: enter the three secrets in the Render dashboard (they are never stored in this file).
      - key: PAYMENT_PROVIDER
        value: paynow
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PAYNOW_AUTH_EMAIL
        sync: false
      - key: PAYNOW_MODE
        value: live
      - key: PAYNOW_CURRENCY
        value: USD
